services:
  - type: web
    name: ecoconnect
    runtime: docker
    plan: free
    healthCheckPath: /api/materiais
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase: { name: ecoconnect-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: ecoconnect-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: ecoconnect-db, property: database }
      - key: DB_USER
        fromDatabase: { name: ecoconnect-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: ecoconnect-db, property: password }
      - key: ADMIN_SENHA
        sync: false

databases:
  - name: ecoconnect-db
    plan: free
    databaseName: ecoconnect
    user: ecoconnect
