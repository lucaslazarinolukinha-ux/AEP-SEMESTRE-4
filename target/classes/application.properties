spring.application.name=ecoconnect

# Porta: usa a variável PORT (Render) ou 8080
server.port=${PORT:8080}

# Banco padrão: H2 em arquivo (pasta ./data). Não precisa instalar nada e os dados são mantidos.
# Para usar MySQL, ative o perfil "mysql" (veja application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/ecoconnect
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Carrega materiais iniciais (RN06) depois que as tabelas existem
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Acentos corretos (UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Senha do admin padrão (no Render, defina ADMIN_SENHA)
admin.senha=${ADMIN_SENHA:admin123}
